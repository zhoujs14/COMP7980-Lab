<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
  <style>
    .form {
      margin: 2px 20px;
    }
  </style>
</head>

<body>
  <a href="search" style="margin:10px 10px">jump to search booking</a>
  <h1 style="text-align: center">Book</h1>
  <!-- form template  input element-->
  <form class="form" action="/bookings" method="POST">
    <div class="row mb-3">
      <label for="inputEmail3" class="col-sm-2 col-form-label">Email</label>
      <div class="col-sm-10">
        <input name="email" type="email" class="form-control" id="inputEmail3" required>
      </div>
    </div>
    <div class="row mb-3">
      <label for="inputPassword3" class="col-sm-2 col-form-label">Number of Tickets</label>
      <div class="col-sm-10">
        <input name="numTickets" type="number" class="form-control" id="inputPassword3" min=1 max=4>
      </div>
    </div>
    <!-- check & radio -->
    <fieldset class="row mb-3" style="margin-top: 30px;">
      <hr>
      <legend class="col-form-label col-sm-2 pt-0">Payment Method</legend>
      <div class="col-sm-10">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" id="gridRadios1" value="Credit Card" checked>
          <label class="form-check-label" for="gridRadios1">
            Pay with Credit Card
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="payment" id="gridRadios2" value="Paypal">
          <label class="form-check-label" for="gridRadios2">
            Pay with Paypal
          </label>
        </div>
        <div class="form-check disabled">
          <!-- disabled -->
          <input class="form-check-input" type="radio" name="payment" id="gridRadios3" value="Octopus" disabled>
          <label class="form-check-label" for="gridRadios3">
            Pay with Octopus
          </label>
        </div>
      </div>
    </fieldset>
    <div class="row mb-3">
      <div class="col-sm-10 offset-sm-2">
        <div class="form-check">
          <input name="term" class="form-check-input" type="checkbox" id="gridCheck1">
          <label class="form-check-label" for="gridCheck1">
            Example checkbox
          </label>
        </div>
      </div>
    </div>
    <div class="form-floating mb-3">
      <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea" name="comment"></textarea>
      <label for="floatingTextarea">Comments</label>
    </div>
    <button type="submit" class="btn btn-primary">Confirm</button>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
    crossorigin="anonymous"></script>
  <script>
    var avengers = ["Captain America", "Iron Man", "Thor", "Hulk", "Black Widow", "Hawkeye"];
    var jla = ["Superman", "Batman", "Wonder Woman", "Flash", "Green Lantern", "Aquaman"];

    // user select a team
    function teamSelected(team) {
      superheroElem.options.length = 0
      //alert(team)
      // update hero options coordinately
      if (team == "Avengers") {

        for (var hero of avengers) {
          // add option by js:
          // 1. createElement
          // 2. initial val
          // 3. add to parentNode
          var option = document.createElement("option");
          option.text = hero;
          option.value = hero;
          superheroElem.add(option);
        }

        superheroElem.disabled = false;

      } else if (team == "JLA") {

        for (var hero of jla) {
          var option = document.createElement("option");
          option.text = hero;
          option.value = hero;
          superheroElem.add(option);
        }

        superheroElem.disabled = false;

      } else {

        superheroElem.disabled = true;
      }
    }

    var superheroElem = document.getElementById('superhero')
    superheroElem.options.length = 0

  </script>
</body>

</html>
